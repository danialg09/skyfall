version: '3.8'

services:
  # ==========================================
  # 1. ИНФРАСТРУКТУРА
  # ==========================================
  postgres-bank:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank_db
    ports:
      - "5432:5432"

  postgres-hotel:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotel_db
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ==========================================
  # 2. МИКРОСЕРВИСЫ
  # ==========================================
  bank-system:
    build:
      context: ./bank-card-management-system
    ports:
      - "8081:8080"
    depends_on:
      - postgres-bank
      - redis
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-bank:5432/bank_db
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_JWT_SECRET: 3cfa76ef14937c7c0facbbdc7b69273aе8b1b59c9d52d9646c2438577884297123984719283748237498273498273492

  hotel-system:
    build:
      context: ./hotel-booking-system
    ports:
      - "8082:8080"
    depends_on:
      - postgres-hotel
      - redis
      - mongodb
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-hotel:5432/hotel_db
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_JWT_SECRET: 3cfa76ef14937c7c0facbbdc7b69273aе8b1b59c9d52d9646c2438577884297123984719283748237498273498273492
  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - bank-system
      - hotel-system